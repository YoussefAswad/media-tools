[project]
name = "media-orchestrator"
version = "0.0.0"
description = "ARR-driven media orchestrator, plus the standalone mkvprune tool it drives."
requires-python = ">=3.12"
dependencies = [
    "mediacore",
    "orchestrator",
    "mkvprune",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mediacore = { workspace = true }
orchestrator = { workspace = true }
mkvprune = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# B008: FastAPI/Typer require calls (Depends/Form/Argument) in argument defaults.
# UP047: PEP 695 generics are 3.12+, but mediacore keeps 3.11 support via TypeVar.
ignore = ["E501", "B008", "UP047"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages"]
