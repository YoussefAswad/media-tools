# Snippet to merge into my-media-server/docker-compose.yml.
# Mount the media library at the SAME path Radarr/Sonarr use (here: /data) so webhook paths
# are directly openable; otherwise set arr.*.media_root / local_media_root in config.yaml.
services:
  media-orchestrator:
    build:
      context: ../media-orchestrator    # adjust to wherever the repo lives
      dockerfile: deploy/orchestrator/Dockerfile
    image: youssefaswad/media-orchestrator:latest
    container_name: media-orchestrator
    restart: unless-stopped
    environment:
      - ORCH_WEBHOOK_SECRET=${ORCH_WEBHOOK_SECRET}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - NTFY_MEDIAQC_USER=${NTFY_MEDIAQC_USER}
      - NTFY_MEDIAQC_PASSWORD=${NTFY_MEDIAQC_PASSWORD}
      # Router admin password, for the Bandwidth tab's per-device WAN usage (monitoring.router).
      # The router's API also exposes its storage-service credentials, so treat this as a
      # higher-value secret than it looks.
      - ROUTER_PASSWORD=${ROUTER_PASSWORD}
      # - ORCH_UI_USER=${ORCH_UI_USER}
      # - ORCH_UI_PASSWORD=${ORCH_UI_PASSWORD}
    volumes:
      - ./orchestrator/config:/config
      - ./orchestrator/state:/state
      - /path/to/media:/data          # SAME mount path as radarr/sonarr
    # /readyz fails (503) if the worker loop is wedged or the db is unreachable; /healthz is
    # liveness only. start_period covers a long in-flight prune on (re)start.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # cpus: "4"                        # re-encodes are CPU-heavy; cap if desired
    networks:
      - default
