# media-tools orchestrator config. Copy to /config/config.yaml (a mounted volume).
# Secrets are ${ENV} references — expanded at load, never written back resolved, so this file
# is safe to edit in the web UI. Set the referenced vars in the container environment.

server:
  host: 0.0.0.0
  port: 8000

# Shared secret ARR must send as the `X-Webhook-Token` header on its Webhook Connect.
webhook_secret: ${ORCH_WEBHOOK_SECRET}

arr:
  radarr:
    base_url: http://radarr:7878
    api_key: ${RADARR_API_KEY}
    # Only needed if this container mounts the library at a different prefix than Radarr:
    # media_root: /data          # path as Radarr reports it
    # local_media_root: /data    # path as this container sees it
  sonarr:
    base_url: http://sonarr:8989
    api_key: ${SONARR_API_KEY}

ntfy:
  url: http://ntfy:80
  topic: media-quality             # quality-check findings
  # status_topic: media-status     # optional: split action status from findings
  user: ${NTFY_MEDIAQC_USER}
  password: ${NTFY_MEDIAQC_PASSWORD}
  status_granularity: job          # job | action | off

# qBittorrent connection for the Downloads bandwidth ledger (omit to disable auto-capture).
qbit:
  base_url: http://qbittorrent:45666
  username: ${QBIT_WEBUI_USER}
  password: ${QBIT_WEBUI_PASS}

# Jellyfin connection — triggers an incremental library refresh after each import.
# Create an API key in Jellyfin → Dashboard → API Keys. Blank/omitted = refresh disabled.
jellyfin:
  base_url: http://jellyfin:8096
  api_key: ${JELLYFIN_API_KEY}

policy:
  audio_allow: [ac3, eac3, truehd, mlp, dts]
  audio_min_channels: 2
  audio_max_tracks: 2
  subtitle_keep_langs: [eng, en, ara, ar]
  subtitle_flag_untagged: false
  keep_default_subtitle: false     # true = never drop the current default sub, even if foreign

audit:
  state_dir: /state

web:
  # Optional app-level basic auth for the UI (Caddy may also enforce its own).
  basic_auth_user: ${ORCH_UI_USER:-}
  basic_auth_password: ${ORCH_UI_PASSWORD:-}

# Pipeline toggles
enable_seasonal_shift: true
enable_quality_check: true
enable_prune: true
enable_ledger: true          # capture download bandwidth from qBittorrent at import
max_attempts: 3
retry_backoff_s: [30, 300, 1800]   # per-attempt requeue delay (clamped to the last entry)

# Background maintenance (runs on the worker thread between jobs)
maintenance_interval_s: 300   # how often retention / dead-revive / quota checks run
retention_days: 90            # delete finished jobs + audit rows older than this (0 = keep; JSONL always kept)
quota_alert_pcts: [85, 100]   # ntfy once when quota usage crosses each level (needs a cutoff limit)
dead_revive_cooldown_s: 3600  # auto-requeue a dead job once it has sat idle this long
dead_revive_max: 1            # times a dead job may be auto-revived (0 disables)

# Prune disk-space guard
prune_min_free_multiplier: 1.3   # require free space >= source_size * this before pruning
prune_low_space_backoff_s: 1800  # when short, defer the job this long (no attempt consumed)

# System monitoring (Monitoring tab). Disk usage is read in-container via statvfs, so each watched
# `path` must be one this container can see. With the default mounts, /data = the media disk and
# /state = the config/backup disk. To watch another host filesystem, bind-mount it here first
# (e.g. add `- /:/host:ro` to the service) and point `path` at it.
monitoring:
  enabled: true
  disk_interval_s: 60          # how often disks are sampled (cheap: one statvfs per path)
  retention_days: 30           # drop metric samples older than this (0 = keep forever)
  disks:
    - { path: /data,  label: MASS,  warn_pct: 85, crit_pct: 95, crit_free: 50GB }
    - { path: /state, label: VAULT, warn_pct: 85, crit_pct: 95, crit_free: 20GB }
    # To watch the HOST ROOT (system) disk, bind-mount the host root read-only into the
    # container first (add `- /:/host:ro` to the media-orchestrator service, as the dashdot
    # container does) and point a watch at it:
    # - { path: /host, label: ROOT, warn_pct: 85, crit_pct: 95, crit_free: 5GB }
  # A breach is raised when EITHER the fill % OR the absolute free space crosses its threshold.
  # Any threshold left unset/null is ignored. warn_free/crit_free accept "50GB", "20GiB", etc.
  disk_alert:                  # debounce/hysteresis (disks creep, so long holds avoid flapping)
    sustain_s: 120             # breach must persist this long before alerting
    clear_s: 300               # recovery must hold this long before "back to normal"
    cooldown_s: 21600          # min re-notify interval while still breached (6h)
  # ntfy_topic: system-health  # optional override; defaults to the ntfy status topic

# seasonal-shift per-show offsets (matched to a Sonarr series by `name`).
shows: []
#  - name: "Some Anime"
#    path: /data/tv/Some Anime
#    seasons:
#      2: { season_offset: -1, episode_offset: 12 }
#    specials: {}
