[project]
name = "orchestrator"
version = "0.1.0"
description = "ARR-driven media orchestrator: webhook service, durable queue/worker, and web UI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Youssef Aswad", email = "youssefaswad@gmail.com" }]
dependencies = [
    "mediacore",
    "mkvprune",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "pydantic>=2",
    "requests>=2.32",
]

[project.scripts]
orchestrator = "orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
mediacore = { workspace = true }
mkvprune = { workspace = true }
