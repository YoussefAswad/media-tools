{% extends "base.html" %}
{% block nav_dl %}active{% endblock %}
{% block title %}Downloads — Media Orchestrator{% endblock %}
{% block content %}
<div class="toolbar">
  <div class="filters" id="range-filter">
    <button data-range="7d" class="chip">7d</button>
    <button data-range="30d" class="chip active">30d</button>
    <button data-range="90d" class="chip">90d</button>
    <button data-range="1y" class="chip">1y</button>
    <button data-range="all" class="chip">All</button>
  </div>
  <div class="daterange" id="date-range">
    <input type="date" id="date-from" title="From">
    <span class="muted">→</span>
    <input type="date" id="date-to" title="To">
    <button type="button" class="chip" id="date-clear" title="Clear custom range">✕</button>
  </div>
  <input type="search" id="search" placeholder="Search downloads…" autocomplete="off">
  <div class="filters" id="source-filter">
    <button data-source="" class="chip active">All</button>
    <button data-source="qbittorrent" class="chip">Auto</button>
    <button data-source="manual" class="chip">Manual</button>
  </div>
  <button class="ghost" type="button" onclick="document.getElementById('add-entry').hidden = !document.getElementById('add-entry').hidden">+ Add entry</button>
</div>

<section class="card" id="add-entry" hidden>
  <h2>Add manual entry</h2>
  <form method="post" action="/downloads/add" class="entry-form">
    <label>Name<input name="name" required></label>
    <label>Type
      <select name="kind">
        {% for k in kinds %}<option value="{{ k }}">{{ k|capitalize }}</option>{% endfor %}
      </select>
    </label>
    <label>Downloaded<input name="downloaded" placeholder="e.g. 12.3 GB" value="0"></label>
    <label>Uploaded<input name="uploaded" placeholder="e.g. 500 MB" value="0"></label>
    <label>Size (optional)<input name="size" placeholder="e.g. 12 GB"></label>
    <label>Completed<input name="completed_at" type="date"></label>
    <label class="wide">Notes<input name="notes"></label>
    <div class="row-actions"><button type="submit">Add</button></div>
  </form>
</section>

<div class="summary" data-src="/ui/ledger-summary" data-interval="0" data-ranged>Loading…</div>

<section class="card">
  <h2>Bandwidth by day</h2>
  <div data-src="/ui/ledger-chart" data-interval="0" data-ranged>Loading…</div>
</section>

<section class="card">
  <div class="card-head">
    <h2>Downloads</h2>
    <div class="filters" id="type-filter">
      <button data-type="" class="chip active">All types</button>
      {% for k in kinds %}<button data-type="{{ k }}" class="chip">{{ k|capitalize }}</button>{% endfor %}
    </div>
  </div>
  <div data-src="/ui/ledger" data-interval="0" data-ranged data-searchable
       data-filtered="type-filter" data-source-filtered="source-filter">Loading…</div>
</section>
{% endblock %}
