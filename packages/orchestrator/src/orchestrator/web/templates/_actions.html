{% if not actions %}
  <p class="muted empty">No actions recorded yet.</p>
{% else %}
<table class="actions">
  <thead><tr><th>When</th><th>Tool</th><th>Action</th><th>Result</th><th>File</th></tr></thead>
  <tbody>
  {% for a in actions %}
    <tr>
      <td class="muted nowrap">{{ a.ts.replace("T", " ") }}</td>
      <td>{{ a.tool }}</td>
      <td>{{ a.action }}</td>
      <td><span class="badge {{ a.result }}">{{ a.result }}</span></td>
      <td class="path" title="{{ a.path or '' }}">{{ (a.path or "").split("/")[-1] }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
