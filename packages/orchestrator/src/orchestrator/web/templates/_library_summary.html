{% include "_summary.html" %}
{% if scanning %}
{# spans the whole tile grid: the scan is the page's headline while it runs #}
<div class="scan-live">
  <div class="jobbar"><div class="jobbar-fill" style="width: {{ (scan.progress or 0)|round|int }}%"></div></div>
  <div class="jobbar-note">
    {{ scan.progress_note or ("waiting for the worker" if scan.status == "queued" else "starting…") }}
    · <a href="/jobs/{{ scan.id }}">job detail</a>
  </div>
</div>
{% endif %}
