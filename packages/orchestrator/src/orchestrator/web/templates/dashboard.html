{% extends "base.html" %}
{% block nav_dash %}active{% endblock %}
{% block content %}
<div class="summary" data-src="/ui/summary" data-interval="4000">Loading…</div>

<div class="grid">
  <section class="card">
    <div class="card-head"><h2><a href="/monitoring">System</a></h2></div>
    <div data-src="/ui/mon-system" data-interval="30000">Loading…</div>
  </section>
  <section class="card">
    <div class="card-head"><h2><a href="/monitoring">Disks</a></h2></div>
    <div class="mon-list" data-src="/ui/mon-disks" data-interval="60000">Loading…</div>
  </section>
</div>

<div class="grid grid-3">
  <section class="card">
    <div class="card-head"><h2><a href="/downloads">Bandwidth</a></h2></div>
    <div data-src="/ui/ledger-remaining" data-interval="30000">Loading…</div>
  </section>
  <section class="card">
    <div class="card-head"><h2><a href="/monitoring">Containers</a></h2></div>
    <div data-src="/ui/mon-containers-summary" data-interval="30000">Loading…</div>
  </section>
  <section class="card">
    <div class="card-head"><h2><a href="/jobs">Worker</a></h2></div>
    <div data-src="/ui/worker?readonly=1" data-interval="4000">Loading…</div>
  </section>
</div>

<section class="card">
  <div class="card-head"><h2><a href="/monitoring">Active alerts</a></h2></div>
  <div data-src="/ui/mon-alerts" data-interval="10000">Loading…</div>
</section>

<section class="card">
  <div class="card-head"><h2><a href="/jobs">Recent activity</a></h2></div>
  <div class="scroll-y" data-src="/ui/actions?limit=10" data-interval="3000">Loading…</div>
</section>
{% endblock %}
