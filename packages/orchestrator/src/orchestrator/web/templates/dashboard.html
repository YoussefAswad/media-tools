{% extends "base.html" %}
{% block content %}
<div class="grid">
  <section class="card">
    <h2>Active <span class="muted">/ queued</span></h2>
    <div data-src="/ui/active" data-interval="2000">Loading…</div>
  </section>
  <section class="card">
    <h2>Failed <span class="muted">/ dead-letter</span></h2>
    <div data-src="/ui/failed" data-interval="3000">Loading…</div>
  </section>
</div>
<section class="card">
  <h2>Recent actions</h2>
  <div data-src="/ui/actions" data-interval="3000">Loading…</div>
</section>
{% endblock %}
