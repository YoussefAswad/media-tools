[project]
name = "quality-check"
version = "0.1.0"
description = "Probe-based media quality rules (audio/subtitle layout checks) for Radarr/Sonarr imports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Youssef Aswad", email = "youssefaswad@gmail.com" }]
dependencies = [
    "mediacore",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
quality-check = "quality_check.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_check"]

[tool.uv.sources]
mediacore = { workspace = true }
