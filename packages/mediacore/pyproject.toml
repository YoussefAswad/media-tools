[project]
name = "mediacore"
version = "0.1.0"
description = "Shared core: config, models, audit, probe facade, ARR/ntfy/qbit/Jellyfin clients, media policy, episode renumbering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Youssef Aswad", email = "youssefaswad@gmail.com" }]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "requests>=2.32",
    "mkvprune",
]

[project.urls]
Homepage = "https://github.com/YoussefAswad/media-orchestrator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediacore"]

[tool.uv.sources]
mkvprune = { workspace = true }
